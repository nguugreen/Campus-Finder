<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Campus Finder - ค้นหาอาคาร จุดบริการ และเวลาเปิด-ปิดภายในมหาวิทยาลัย">
  <title>Campus Finder | หน้าแรก</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">ข้ามไปยังเนื้อหาหลัก</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Campus Finder</a>
      <nav aria-label="เมนูหลัก">
        <ul class="nav-list">
          <li><a href="index.html" aria-current="page">หน้าแรก</a></li>
          <li><a href="places.html">สถานที่ทั้งหมด</a></li>
          <li><a href="favorites.html">รายการโปรด</a></li>
          <li><a href="suggest.html">เสนอแนะ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">หาอาคารในมหาวิทยาลัยได้ในไม่กี่วินาที</h1>
      <form id="home-search-form" class="search-form" role="search">
        <label for="home-search" class="visually-hidden">ค้นหาด้วยชื่อหรือรหัสอาคาร</label>
        <input id="home-search" name="q" type="search"
               placeholder="เช่น ห้องสมุด หรือ SC01" autocomplete="off">
        <button type="submit" class="btn btn-primary">ค้นหา</button>
      </form>
    </section>

    <section aria-labelledby="categories-title">
      <h2 id="categories-title">หมวดหมู่</h2>
      <ul id="category-list" class="chip-list"></ul>
    </section>

    <section aria-labelledby="featured-title">
      <h2 id="featured-title">สถานที่แนะนำ</h2>
      <p id="featured-status" class="status-message" aria-live="polite"></p>
      <ul id="featured-list" class="card-grid"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>SC17332 Mini Project · กลุ่ม 1 · ข้อมูลเก็บโดยนักศึกษา</p>
    </div>
  </footer>

  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
